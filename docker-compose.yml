name: payroll-api

# 社会保険料率・雇用保険料率・源泉所得税 API + MCP。
# 外部公開とTLSは passist の Caddy (passist-caddy-1) が担い、payroll-api.paps.jp をここへ転送する。
# 既定はトークン不要の公開API。.env に RATES_API_TOKEN を入れると Bearer トークン必須に戻せる。
services:
  payroll-api:
    build: ./src
    image: payroll-api:latest
    container_name: payroll-api
    restart: unless-stopped
    environment:
      RATES_API_TOKEN: ${RATES_API_TOKEN:-} # 空ならトークン不要(IPごとのレート制限+一時ブロックで保護)
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - passist_pn

networks:
  passist_pn:
    external: true
